<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Chat2Play · First-person walk</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#332841;color:#fff;font:15px system-ui}#world{position:absolute;inset:0}canvas{display:block;touch-action:none}header{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:none}header>*{pointer-events:auto}a,button,select{font:inherit;color:#fff;border:1px solid #d9baff88;background:#332645e8;border-radius:12px;padding:10px 14px;text-decoration:none;touch-action:none}button{cursor:pointer}h1{font-size:18px;margin:0;padding:10px 14px;background:#332645e8;border-radius:12px}.help{position:absolute;top:74px;left:12px;max-width:calc(100% - 24px);background:#332645cf;border-radius:10px;padding:8px 12px;pointer-events:none;font-size:13px}.crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#ffffff90;pointer-events:none}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:16px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 145px);justify-content:flex-end}.controls button[aria-pressed=true]{background:#7c4d9c}#joystick{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:20px;width:104px;height:104px;background:#33264570;border:2px solid #f2ddff80;border-radius:50%;touch-action:none;user-select:none}#stick{position:absolute;left:30px;top:30px;width:40px;height:40px;background:#f3d9ffbb;border:2px solid #ffffffbb;border-radius:50%;pointer-events:none}#move-label{position:absolute;bottom:8px;width:100%;text-align:center;font-size:11px;pointer-events:none}#status{position:absolute;bottom:136px;left:20px;background:#332645cc;border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#2c243de8;font-size:20px;z-index:5}#loading[hidden]{display:none}@media(max-width:600px){header{gap:6px}header a,header select{font-size:12px;padding:8px}h1{font-size:14px;padding:8px}.help{top:92px;font-size:12px}.controls button{font-size:12px;padding:10px}#joystick{width:100px;height:100px}#stick{left:28px;top:28px}}</style></head><body>
<main id="world" role="img" aria-label="First-person walking with a visible full character body"></main>
<header><a href="/assets/characters/review.html">← Studio</a><h1>First-person walk</h1><label><select id="character" aria-label="Your character"><option value="female">Pink character</option><option value="male">Blue character</option></select></label></header>
<p class="help">Drag to look · WASD / arrows or the move pad to walk · Look down to see your body</p><i class="crosshair" aria-hidden="true"></i>
<div id="joystick" role="group" aria-label="Movement pad"><div id="stick"></div><span id="move-label">MOVE</span></div><output id="status" aria-live="off">Standing</output>
<div class="controls"><button id="down">Look down</button><button id="ahead">Look ahead</button><button id="walk" aria-pressed="false">Walk</button><button id="reset">Reset</button></div><div id="loading" role="status">Preparing your character…</div>
<script type="module" src="/scripts/characters/first-person.ts"></script></body></html>
