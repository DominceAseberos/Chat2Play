<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Chat2Play · First-person throw</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#29213f;color:#fff2ff;font:15px system-ui}
  header{position:absolute;top:12px;left:16px;right:16px}nav{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  a,button,select{font:inherit;color:inherit;border:1px solid #a68bb8;background:#3e3056;border-radius:12px;padding:9px 13px;text-decoration:none}
  button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:wait;opacity:.65}:focus-visible{outline:3px solid #ffe19a;outline-offset:3px}
  h1{font-size:22px;text-align:center;margin:10px 0 3px}.help{text-align:center;margin:0;color:#d9c8e7;font-size:13px}
  #world{position:absolute;inset:126px 0 176px;overflow:hidden}canvas{display:block;touch-action:none;width:100%;height:100%}
  #status{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:20px;background:#21192fe6;white-space:nowrap;font-weight:600;pointer-events:none}
  footer{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:16px;right:16px;display:grid;gap:10px;justify-items:center}
  .choices{display:flex;gap:8px;width:min(100%,440px)}.choices button{flex:1;min-width:0;min-height:42px;padding:10px 8px}.choices button[aria-pressed=true]{background:#985d9d;border-color:#ffbbe4;box-shadow:0 0 0 1px #ffbbe4}
  .actions{display:flex;gap:8px;width:min(100%,440px)}.actions button{min-height:44px}#throw{flex:1;background:#f3acd4;color:#2c1939;font-weight:700;border-color:#ffd1ed}#reset{font-size:13px}
  .hint{margin:0;font-size:12px;color:#cdbbdc;text-align:center}#loading{position:absolute;inset:0;background:#29213f;display:grid;place-items:center;z-index:3}#loading[hidden]{display:none}
  @media(max-width:400px){nav a,nav select{font-size:12px;padding:8px 10px}h1{font-size:19px}.help{font-size:12px}#reset{padding:9px}.hint{font-size:11px}}
  @media(max-height:600px){h1{font-size:18px;margin-top:7px}.help{display:none}#world{top:100px;bottom:152px}footer{gap:7px}.hint{display:none}}
 </style>
</head>
<body>
 <header>
  <nav><a href="/assets/characters/review.html">← Studio</a><a href="/assets/characters/first-person.html?look=down">Walk POV</a><select id="character" aria-label="Your character"><option value="female">Pink character</option><option value="male">Blue character</option></select></nav>
  <h1>First-person throw</h1><p class="help">Choose your hand, then throw. Drag the scene to look around.</p>
 </header>
 <main id="world" aria-label="First-person Rock Paper Scissors animation preview"><output id="status" role="status" aria-live="polite">Ready to throw</output></main>
 <footer>
  <div class="choices" role="group" aria-label="Your hand"><button data-choice="rock" aria-pressed="false">Rock</button><button data-choice="paper" aria-pressed="true">Paper</button><button data-choice="scissors" aria-pressed="false">Scissors</button></div>
  <div class="actions"><button id="throw">Throw</button><button id="reset">Reset view</button></div>
  <p class="hint">Animation preview · 1 / 2 / 3 to choose · Space to throw</p>
 </footer>
 <div id="loading" role="status">Preparing your character…</div>
 <script type="module" src="/scripts/characters/first-person-rps.ts"></script>
</body>
</html>
