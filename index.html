<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" sizes="any"/>
    <link rel="icon" type="image/png" href="/favicon-64.png?v=3" sizes="64x64"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3"/>
    <link rel="manifest" href="/site.webmanifest"/>
    <meta name="theme-color" content="#090b10"/>
    <meta name="color-scheme" content="dark light"/>
    <style>html,body{background:#090b10}html[data-theme="light"],html[data-theme="light"] body{background:#eeeef2}</style>
    <script>
      (()=>{try{const t=localStorage.getItem("c2p:theme-noir")==="light"?"light":"dark";document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').setAttribute("content",t==="light"?"#eeeef2":"#090b10");}catch(_){document.documentElement.dataset.theme="dark";}})();
    </script>
    <meta name="description" content="Chat2Play — meet a stranger, chat and play together."/>
    <title>Chat2Play — Meet. Chat. Play.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
